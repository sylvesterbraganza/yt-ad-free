<!doctype html>
<!-- Debug-only page (not in release builds): checks that the engine's full-screen API works in the app. -->
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:18px sans-serif;padding:24px}button{font-size:22px;padding:20px 32px;margin-top:220px}</style>
</head><body>
<div id="out">fullscreenEnabled=<span id="fe"></span></div>
<button id="b">Go full screen</button>
<script>
  const out = (m) => { console.log("FSTEST " + m); document.getElementById("out").append(" | " + m); };
  document.getElementById("fe").textContent = document.fullscreenEnabled;
  console.log("FSTEST fullscreenEnabled=" + document.fullscreenEnabled);
  document.addEventListener("fullscreenchange", () => out("change, element=" + !!document.fullscreenElement));
  document.addEventListener("fullscreenerror", () => out("fullscreenerror event"));
  document.getElementById("b").onclick = () =>
    document.documentElement.requestFullscreen().then(() => out("resolved")).catch(e => out("rejected: " + e));
</script></body></html>
